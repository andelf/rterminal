<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>rterminal · web</title>
  <link rel="stylesheet" href="/web/vendor/xterm.min.css">
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">rterminal<span class="brand-dim"> / web</span></span>
    <div class="actions">
      <button id="new-tab" class="icon-btn" title="New tab">+</button>
      <button id="scrollback" class="icon-btn" title="Scrollback">↕</button>
      <button id="refresh" class="icon-btn" title="Refresh tabs">↻</button>
      <button id="toggle-toolbar" class="icon-btn" title="Toggle key toolbar" aria-pressed="false">⌨</button>
      <button id="debug" class="icon-btn" title="采集输入事件用于调试：开启后浏览器把 keydown / composition / beforeinput / input / 实际发送的字节流回传到服务端日志，可用 GET /web/debug/log 取回。" aria-pressed="false">◎</button>
      <button id="size-mode" class="mode-toggle" aria-pressed="false" title="切换尺寸权威方。PC 尺寸（默认）：以 PC 窗口为准，浏览器镜像网格并滚动/补点。浏览器尺寸：以浏览器视口为准，PC 窗口自动调整到相同网格，两端都不滚动。">
        <span id="size-mode-label">PC 尺寸</span>
      </button>
      <button id="keyboard-mode" class="mode-toggle" aria-pressed="false" title="切换输入方式。系统键盘（默认）：使用浏览器/系统软键盘，支持中文听写与 IME。屏幕键盘：使用页面内置全键盘，按键直接送入终端，不唤起系统软键盘；外接物理键盘仍然可用。">
        <span id="keyboard-mode-label">系统键盘</span>
      </button>
    </div>
  </header>

  <nav id="tabs" class="tabstrip" aria-label="Terminal tabs"></nav>

  <main id="panes" class="panes">
    <div id="empty-state" class="empty-state" hidden>
      <button id="empty-new-tab" class="empty-add" title="New tab">+</button>
    </div>
  </main>

  <pre id="scrollback-view" class="scrollback" hidden></pre>

  <div id="key-toolbar" class="key-toolbar" aria-label="Shell key toolbar" hidden>
    <div id="key-scroll" class="key-scroll"></div>
    <div id="key-nav" class="key-nav"></div>
  </div>

  <section id="screen-keyboard" class="screen-keyboard" aria-label="Built-in screen keyboard" hidden>
    <div class="sk-bar">
      <span class="sk-bar-label">屏幕键盘</span>
      <button id="sk-layout-toggle" class="sk-layout-toggle" type="button" aria-pressed="false">Mac 样式</button>
    </div>
    <div id="sk-layout" class="sk-layout"></div>
  </section>

  <footer class="statusbar">
    <span id="status">connecting…</span>
  </footer>

  <script src="/web/vendor/xterm.min.js"></script>
  <script src="/web/app.js"></script>
</body>
</html>
