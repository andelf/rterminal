<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rterminal · web</title>
  <link rel="stylesheet" href="/web/vendor/xterm.min.css">
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">rterminal<span class="brand-dim"> / web</span></span>
    <div class="actions">
      <button id="new-tab" title="New tab (same as native Cmd/Ctrl+T)">+ New tab</button>
      <button id="scrollback" title="Fetch native scrollback for this tab">Scrollback</button>
      <button id="refresh" title="Refresh tab list">↻</button>
    </div>
  </header>

  <nav id="tabs" class="tabstrip" aria-label="Terminal tabs"></nav>

  <main id="panes" class="panes"></main>

  <pre id="scrollback-view" class="scrollback" hidden></pre>

  <footer class="statusbar">
    <span id="status">connecting…</span>
    <span class="hint">Tabs mirror the native window · input goes to the same PTY · loopback only by default</span>
  </footer>

  <script src="/web/vendor/xterm.min.js"></script>
  <script src="/web/app.js"></script>
</body>
</html>
